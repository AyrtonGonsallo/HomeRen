<div class="masonry-gallery">

  <!-- 1ère image full width -->
  <div
    class="masonry-item masonry-item--hero"
    *ngIf="galerie?.Images?.length"
    (click)="openImage(0)"
  >
    <img [src]="baseurl + galerie.Images[0].Url" alt="image" />
  </div>

  <!-- reste en grid -->
  <div
    class="masonry-item"
    *ngFor="let image of galerie?.Images?.slice(1); let i = index"
    (click)="openImage(i + 1)"
  >
    <img [src]="baseurl + image.Url" alt="image" />
  </div>

</div>
  </div>    
</div>
