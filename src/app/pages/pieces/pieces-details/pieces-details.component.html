<link href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" rel="stylesheet">
<div class="page-realisations">

    <div class="section-t-bar" [ngStyle]="{'background-image': 'url(' + baseurl+ piece?.Image_presentation + ')'}">
      <h1 class="font-site center">{{piece?.Titre}}</h1>
      <p class="fs-27 center m-w-t-bar"  *ngIf="piece?.['Présentation']">
        {{piece['Présentation']}}
      </p>
      <a class="btn-site tl-br"  href="/devis-en-ligne">Devis en ligne</a>
    </div>
    
    <div class="sec-gal-piece" *ngIf="piece?.Description">  
      <div class="section-desc">   
        <div [innerHTML]="piece?.Description"></div>
      </div>
    </div>
